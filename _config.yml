title: "Zerina Aličehajić"
subtitle: "Economics, Policy & Geopolitics"
url: "https://zerina-alicehajic.github.io"
baseurl: "/portfolio_research"

remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air"

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-include-cache

author:
  name: "Zerina Aličehajić"
  avatar: "assets/images/profilepic.jpg" # Removed leading slash for cleaner baseurl resolution
  bio: "bacc. Management (MIT) | M.Sc. Candidate at EFSA"
  location: "Sarajevo, BiH"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/zerina-alicehajic"
      
defaults:
  # Applies author_profile to ALL files across the site
  - scope:
      path: ""
    values:
      layout: "single"
      author_profile: true


