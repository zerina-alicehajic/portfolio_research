---
layout: default
---

<article class="page" itemscope itemtype="https://schema.org/CreativeWork">
  <header class="essay-header" style="border-bottom: 2px solid #111; margin-bottom: 2rem; padding-bottom: 1rem;">
    {% if page.category %}
      <span style="text-transform: uppercase; font-size: 0.85rem; font-weight: 700; letter-spacing: 1px; color: #e51224;">
        {{ page.category }}
      </span>
    {% endif %}
    <h1 class="page__title" style="font-family: Georgia, serif; font-size: 2.2rem; margin-top: 0.5rem; margin-bottom: 0.5rem; font-weight: 700;">
      {{ page.title }}
    </h1>
    {% if page.subtitle %}
      <p style="font-family: Georgia, serif; font-size: 1.25rem; color: #555; font-style: italic; margin-bottom: 1rem;">
        {{ page.subtitle }}
      </p>
    {% endif %}
    <div style="font-size: 0.85rem; color: #777;">
      <span>By <strong>{{ page.author | default: site.author.name }}</strong></span> |
      <span>{{ page.date | date: "%B %d, %Y" }}</span> |
      <span>{{ page.read_time }} min read</span>
    </div>
  </header>

  <section class="page__content" style="font-family: Georgia, Cambria, serif; font-size: 1.1rem; line-height: 1.7; color: #222;">
    {{ content }}
  </section>
</article>
